name: Generate dependency lockfile cleanup

on:
  push:
    branches:
      - hardening/dependency-moderate-cleanup
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/dependency-moderate-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock moderate dependency security overrides"
          git push origin HEAD:hardening/dependency-moderate-cleanup
