name: COHIBA Local Token Verify

on:
  push:
    branches: [devnet, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Create ephemeral local wallet
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { Keypair } from "@solana/web3.js";
          const kp=Keypair.generate();
          fs.writeFileSync("/tmp/cohiba-local-wallet.json", JSON.stringify(Array.from(kp.secretKey)));
          console.log("LOCAL_WALLET="+kp.publicKey.toBase58());
          NODE

      - name: Install Solana development environment
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start local Solana validator
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$PATH"
          solana --version
          solana-test-validator --reset --quiet > /tmp/validator.log 2>&1 &
          echo $! > /tmp/validator.pid
          for i in {1..30}; do
            if solana cluster-version --url http://127.0.0.1:8899 >/dev/null 2>&1; then
              echo "LOCAL_VALIDATOR_READY"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/validator.log
          exit 1

      - name: Fund local wallet
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$PATH"
          PUBKEY=$(node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {Keypair} from "@solana/web3.js";
          const kp=Keypair.fromSecretKey(Uint8Array.from(JSON.parse(fs.readFileSync("/tmp/cohiba-local-wallet.json","utf8"))));
          console.log(kp.publicKey.toBase58());
          NODE
          )
          solana airdrop 10 "$PUBKEY" --url http://127.0.0.1:8899
          solana balance "$PUBKEY" --url http://127.0.0.1:8899

      - name: Mint fixed supply and revoke authorities on local validator
        env:
          SOLANA_WALLET_PATH: /tmp/cohiba-local-wallet.json
          SOLANA_RPC_URL: http://127.0.0.1:8899
        run: npm run token:create:local | tee /tmp/mint-output.txt

      - name: Upload verification output
        uses: actions/upload-artifact@v4
        with:
          name: cohiba-local-verification
          path: |
            /tmp/mint-output.txt
            /tmp/validator.log
