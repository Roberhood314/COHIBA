name: COHIBA Devnet Verify

on:
  push:
    branches: [devnet]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Create ephemeral Devnet wallet
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { Keypair } from "@solana/web3.js";
          const kp=Keypair.generate();
          fs.writeFileSync("/tmp/cohiba-devnet-wallet.json", JSON.stringify(Array.from(kp.secretKey)));
          console.log("DEVNET_WALLET="+kp.publicKey.toBase58());
          NODE

      - name: Install compatible Rust + PoW Devnet faucet CLI
        run: |
          rustup toolchain install 1.70.0 --profile minimal
          cargo +1.70.0 install devnet-pow --locked
          devnet-pow --version

      - name: Fund ephemeral wallet via PoW faucet
        run: |
          devnet-pow --keypair-path /tmp/cohiba-devnet-wallet.json --url dev mine --target-lamports 100000000
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {Connection,Keypair,LAMPORTS_PER_SOL,clusterApiUrl} from "@solana/web3.js";
          const kp=Keypair.fromSecretKey(Uint8Array.from(JSON.parse(fs.readFileSync("/tmp/cohiba-devnet-wallet.json","utf8"))));
          const c=new Connection(clusterApiUrl("devnet"),"confirmed");
          const bal=await c.getBalance(kp.publicKey,"confirmed");
          console.log("DEVNET_BALANCE_SOL="+(bal/LAMPORTS_PER_SOL));
          if (bal < 20_000_000) throw new Error("Insufficient Devnet SOL after PoW faucet.");
          NODE

      - name: Mint fixed-supply Devnet token and revoke authorities
        env:
          SOLANA_WALLET_PATH: /tmp/cohiba-devnet-wallet.json
          SOLANA_RPC_URL: https://api.devnet.solana.com
        run: npm run token:create:devnet | tee /tmp/mint-output.txt

      - name: Upload verification output
        uses: actions/upload-artifact@v4
        with:
          name: cohiba-devnet-verification
          path: /tmp/mint-output.txt
