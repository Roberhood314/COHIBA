name: COHIBA Devnet Verify

on:
  push:
    branches: [devnet]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Create ephemeral Devnet wallet
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { Keypair } from "@solana/web3.js";
          const kp=Keypair.generate();
          fs.writeFileSync("/tmp/cohiba-devnet-wallet.json", JSON.stringify(Array.from(kp.secretKey)));
          console.log("DEVNET_WALLET="+kp.publicKey.toBase58());
          NODE
      - name: Fund wallet from Devnet faucet
        env:
          SOLANA_WALLET_PATH: /tmp/cohiba-devnet-wallet.json
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {Connection,Keypair,LAMPORTS_PER_SOL,clusterApiUrl} from "@solana/web3.js";
          const kp=Keypair.fromSecretKey(Uint8Array.from(JSON.parse(fs.readFileSync(process.env.SOLANA_WALLET_PATH,"utf8"))));
          const c=new Connection(clusterApiUrl("devnet"),"confirmed");
          let funded=false;
          for (const amount of [0.5,0.25,0.1,0.1,0.1]) {
            try {
              const sig=await c.requestAirdrop(kp.publicKey,amount*LAMPORTS_PER_SOL);
              await c.confirmTransaction(sig,"confirmed");
              const bal=await c.getBalance(kp.publicKey,"confirmed");
              console.log("AIRDROP_SIG="+sig+" BALANCE_SOL="+(bal/LAMPORTS_PER_SOL));
              if (bal>0) { funded=true; break; }
            } catch (e) {
              console.log("AIRDROP_RETRY amount="+amount+" error="+String(e));
              await new Promise(r=>setTimeout(r,3000));
            }
          }
          if(!funded) throw new Error("Devnet faucet unavailable after retries.");
          NODE
      - name: Mint fixed-supply Devnet token and revoke authorities
        env:
          SOLANA_WALLET_PATH: /tmp/cohiba-devnet-wallet.json
          SOLANA_RPC_URL: https://api.devnet.solana.com
        run: npm run token:create:devnet | tee /tmp/mint-output.txt
      - name: Upload verification output
        uses: actions/upload-artifact@v4
        with:
          name: cohiba-devnet-verification
          path: /tmp/mint-output.txt
