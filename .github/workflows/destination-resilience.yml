name: Destination Resilience Evidence
on:
  push:
    branches: [main]
    paths: ['packages/authority-verifier/**', 'examples/destination-service/**', 'test/destination-resilience.test.mjs', 'scripts/benchmark-destination.mjs', '.github/workflows/destination-resilience.yml']
  pull_request:
    paths: ['packages/authority-verifier/**', 'examples/destination-service/**', 'test/destination-resilience.test.mjs', 'scripts/benchmark-destination.mjs', '.github/workflows/destination-resilience.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-destination:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: destination_resilience
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native destination fault campaign
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/destination_resilience
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          node --test test/destination-resilience.test.mjs 2>&1 | tee evidence/tests.log
          node scripts/benchmark-destination.mjs > evidence/benchmark.json
          sha256sum evidence/* > evidence.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: destination-resilience-source-evidence
          path: |
            evidence/
            evidence.sha256
