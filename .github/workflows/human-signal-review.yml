name: Human Signal Core Review Evidence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked review dependencies
        run: npm ci --ignore-scripts
      - name: Reproduce signed PoHA and SI focused evidence
        run: npm run verify:human-signal
      - name: Preserve source-bound review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-signal-core-review-${{ github.sha }}
          path: operations/evidence/human-signal-review/
          if-no-files-found: error
