name: Generate hotfix lockfile

on:
  push:
    branches:
      - hotfix/runtime-bigint-buffer
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/runtime-bigint-buffer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock runtime bigint-buffer hotfix"
          git push origin HEAD:hotfix/runtime-bigint-buffer
