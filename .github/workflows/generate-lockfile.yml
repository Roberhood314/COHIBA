name: Generate dependency lockfile

on:
  push:
    branches:
      - hardening/governance-security-pack-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/governance-security-pack-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock verified dependency tree"
          git push origin HEAD:hardening/governance-security-pack-v1
