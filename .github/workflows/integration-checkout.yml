name: Pi and Open USD checkout infrastructure
on:
  pull_request:
    paths:
      - 'integrations/**'
      - 'lib/integration-checkout.mjs'
      - 'lib/pi-network-link.mjs'
      - 'lib/account-state-postgres.mjs'
      - 'lib/poha-postgres.mjs'
      - 'web-server.mjs'
      - 'test/integration-checkout.test.mjs'
      - 'test/wallet-integrations*.test.mjs'
      - 'web/**/integration-checkout*'
      - '.github/workflows/integration-checkout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: checkout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Embedded PostgreSQL and protocol fixtures
        run: node --test test/integration-checkout.test.mjs test/wallet-integrations.test.mjs test/wallet-integrations-http.test.mjs
      - name: Native PostgreSQL concurrency and backup
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/checkout_test
        run: node --test test/integration-checkout.test.mjs
