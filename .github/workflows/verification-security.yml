name: Verification and Security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Invariant and mutation tests
        run: npm test
      - name: Security posture
        run: npm run verify:security
      - name: TypeScript verification
        run: npm run typecheck
      - name: Build and evidence manifest
        run: npm run build
      - name: Dependency audit gate
        run: npm audit --omit=dev --audit-level=high
      - name: Production runtime smoke
        run: |
          rm -rf node_modules
          npm ci --omit=dev
          mkdir -p /tmp/cohiba-data
          COHIBA_DATA_DIR=/tmp/cohiba-data PORT=3080 NODE_ENV=production node web-server.mjs > /tmp/cohiba-runtime.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3080/api/health >/tmp/cohiba-health.json; then
              cat /tmp/cohiba-health.json
              exit 0
            fi
            if ! kill -0 $PID 2>/dev/null; then
              cat /tmp/cohiba-runtime.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/cohiba-runtime.log
          exit 1
      - name: Backup restore and incident tabletop drill
        run: npm run verify:ops
      - uses: actions/upload-artifact@v4
        with:
          name: cohiba-verification-evidence
          path: |
            web/public/security-evidence.json
            docs/VERIFICATION_SPEC.md
            docs/THREAT_MODEL.md
            docs/SECURITY_CONTROL_MATRIX.md
            package-lock.json
            operations/evidence/operational-drill.json
            operations/evidence/operational-drill.md
            release/PRE_MAINNET_EVIDENCE_BUNDLE.md
            launch/PRE_MAINNET_GO_NO_GO.md
