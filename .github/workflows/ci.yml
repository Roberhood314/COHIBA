name: COHIBA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: human_signal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/human_signal_test
      TEST_AGENT_CONTAINER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Pull isolated research guest runtime
        run: docker pull node:22-bookworm-slim
      - name: Build web
        run: npm run build
      - name: Upload scripted isolation research evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-isolation-evidence
          path: operations/evidence/agent-isolation.json
          if-no-files-found: error
