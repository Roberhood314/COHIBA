<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draft Board · Human Signal integration</title><style>body{background:#10151f;color:#eef2ff;font:16px/1.6 system-ui;max-width:800px;margin:40px auto;padding:20px}input,textarea{display:block;width:100%;box-sizing:border-box;background:#192231;color:#eef2ff;border:1px solid #495978;padding:12px;margin:8px 0 20px}textarea{min-height:140px}button{padding:12px 24px;background:#9ac5ff;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#9ac5ff}</style></head><body><h1>Draft Board</h1><p>Ứng dụng riêng xác minh quyền Human/Agent qua Human Signal trước khi lưu bản nháp. Không gửi mật khẩu hoặc phiên đăng nhập Human vào ứng dụng này.</p><p id="service">Đang tải thông tin tích hợp…</p><form id="draft"><label for="resource">Resource được ủy quyền</label><input id="resource" value="draft:article-1" required><label for="text">Nội dung bản nháp</label><textarea id="text" required></textarea><label for="proof">Action proof có chữ ký (payload, signature, approval nếu cần)</label><textarea id="proof" required spellcheck="false"></textarea><button>Lưu sau khi xác minh</button></form><pre id="result" aria-live="polite"></pre><script src="/app.js"></script></body></html>
