<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">COHIBA — The Human Signal</title>
  <desc id="desc">Poster for the official COHIBA project film.</desc>
  <defs>
    <radialGradient id="g1" cx="72%" cy="28%" r="70%">
      <stop offset="0" stop-color="#4d3610"/>
      <stop offset=".45" stop-color="#120d05"/>
      <stop offset="1" stop-color="#030302"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop stop-color="#b87f19"/>
      <stop offset=".5" stop-color="#f0cf72"/>
      <stop offset="1" stop-color="#9b6816"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#g1)"/>
  <circle cx="860" cy="320" r="230" fill="#c9972d" opacity=".08" filter="url(#glow)"/>
  <g opacity=".18" stroke="#d7b45a" stroke-width="1">
    <path d="M0 200H1200M0 400H1200M0 600H1200M0 800H1200M0 1000H1200"/>
    <path d="M200 0V1200M400 0V1200M600 0V1200M800 0V1200M1000 0V1200"/>
  </g>
  <image href="/cohiba-icon-v12.jpg" x="455" y="210" width="290" height="290" preserveAspectRatio="xMidYMid slice"/>
  <text x="600" y="610" fill="url(#gold)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="800" letter-spacing="22">COHIBA</text>
  <text x="600" y="700" fill="#f4efe3" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="700" letter-spacing="6">THE HUMAN SIGNAL</text>
  <line x1="330" y1="760" x2="870" y2="760" stroke="#c9972d" opacity=".5"/>
  <text x="600" y="835" fill="#f0cf72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" letter-spacing="7">FEAR THE MACHINE.</text>
  <text x="600" y="890" fill="#d8d0c2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="6">DEFEND THE HUMAN.</text>
  <g transform="translate(600 1010)">
    <circle r="62" fill="#c9972d" opacity=".94"/>
    <path d="M-16-28L34 0-16 28Z" fill="#070503"/>
